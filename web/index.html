<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Editor</title>
	<script
		src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
		integrity="sha256-3edrmyuQ0w65f8gfBsqowzjJe2iM6n0nKciPUp8y+7E="
		crossorigin="anonymous">
	</script>
	<script src="./nouislider.min.js"></script>
	<link rel="stylesheet" href="./style.css">
	<link rel="stylesheet" href="https://ajax.aspnetcdn.com/ajax/jquery.ui/1.8.9/themes/dot-luv/jquery-ui.css">
	<link rel="stylesheet" href="./nouislider.min.css">
</head>
<body>

	<div id="resizable">
	<div class="video_wrapper">
		<video class="video" loop muted></video>
		<canvas id="canv"></canvas>
		<div class="crop_overlay hidden">
			<div class="crop_shade shade_top"></div>
			<div class="crop_shade shade_bottom"></div>
			<div class="crop_shade shade_left"></div>
			<div class="crop_shade shade_right"></div>
			<div class="crop_box">
				<div class="crop_grid grid_v1"></div>
				<div class="crop_grid grid_v2"></div>
				<div class="crop_grid grid_h1"></div>
				<div class="crop_grid grid_h2"></div>
				<div class="crop_handle" data-handle="nw"></div>
				<div class="crop_handle" data-handle="n"></div>
				<div class="crop_handle" data-handle="ne"></div>
				<div class="crop_handle" data-handle="e"></div>
				<div class="crop_handle" data-handle="se"></div>
				<div class="crop_handle" data-handle="s"></div>
				<div class="crop_handle" data-handle="sw"></div>
				<div class="crop_handle" data-handle="w"></div>
			</div>
		</div>
	</div>
</div>

<input type="file" id="video_selector" accept=".mkv,video/*"/>
<div class="hide_until_load hidden">
	<span class="current_time"></span>
	<div class="slider_wrapper">
		<div id="slider"></div>
		<div class="slider_time_pos"></div>
	</div>
	Start: <input type="number" class="slider_control" data-pos="0" value="0" title="Start" />
	End: <input type="number" class="slider_control" data-pos="1" value="1" title="End" />
	<button class='play_toggle' onClick="pause_toggle()">&#10074;&#10074;</button>
	<label for="mute_toggle">Mute:</label><input type="checkbox" id="mute_toggle" checked />

	<div class="ffmpeg" onclick="copyText()" title="Click here to copy to clipboard.">
		ffmpeg -i in.mp4 -filter:v "crop=80:60:200:100" -c:a copy out.mp4
	</div>

	<fieldset class="cut_mode">
		<legend>Cut mode:</legend>
		<span class="cut_mode_opt">
			<span class="cut_mode_opt_row">
				<input type="radio" id="cut_mode_accurate" name="cut_mode" value="accurate" checked />
				<label class="cut_mode_opt_label" for="cut_mode_accurate">Accurate (re-encode)</label>
			</span>
		</span>
		<span class="cut_mode_opt">
			<span class="cut_mode_opt_row">
				<input type="radio" id="cut_mode_fast" name="cut_mode" value="fast" title="Stream copy: near-instant, but cuts snap to the nearest keyframe before the start time." />
				<label class="cut_mode_opt_label" for="cut_mode_fast" title="Stream copy: near-instant, but cuts snap to the nearest keyframe before the start time.">Fast (stream copy, keyframe-aligned)</label>
			</span>
			<span class="cut_mode_note hidden">Unavailable while a crop is set</span>
		</span>
	</fieldset>

	<input type="button" id="run_ffmpeg" value="Run FFmpeg in-browser!"/>

	<div class="ffmpeg_log">
		Running FFmpeg in-browser is unstable, and may crash. It will not work on large files.
		It may also take a while to get started, as it must download a large (26Mb) library to run.
	</div>

	<div class="download_links">

	</div>
</div>

<script src="./control.js"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.9.5/dist/ffmpeg.min.js"></script>
</body>
</html>
